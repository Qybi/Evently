<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="title desc">
  <title id="title">CancelEventSaga state machine</title>
  <desc id="desc">EventCanceled moves the saga from Initial to CancellationStarted. From there, EventPaymentsRefunded leads to PaymentsRefunded and EventTicketsArchived leads to TicketsArchived. These two states can switch to each other when the remaining event arrives. When both have arrived, the internal EventCancellationCompleted event moves the saga to Final.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d6dce4; }
    .edge { fill: none; stroke: #18202b; stroke-width: 1.5; }
    .internal { stroke-dasharray: 5 4; }
    .node rect { fill: #e4ebfb; stroke: #2c56c9; stroke-width: 1.5; }
    .node text { fill: #18202b; font: 500 14px "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .lbl { fill: #18202b; font: 12.5px "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .sub { fill: #586374; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ink { fill: #18202b; }
    .ring { fill: none; stroke: #18202b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #19202a; stroke: #2b3442; }
      .edge, .ring { stroke: #e5e9ef; }
      .node rect { fill: #1f2b47; stroke: #86a6ff; }
      .node text, .lbl, .ink { fill: #e5e9ef; }
      .sub { fill: #9aa6b6; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path class="ink" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="759" height="539" rx="8"/>

  <!-- Initial -->
  <circle class="ink" cx="380" cy="28" r="9"/>
  <text class="sub" x="396" y="32">Initial</text>

  <!-- Initial -> CancellationStarted -->
  <line class="edge" x1="380" y1="37" x2="380" y2="105" marker-end="url(#arrow)"/>
  <text class="lbl" x="392" y="64">EventCanceled</text>
  <text class="sub" x="392" y="81">publishes EventCancellationStarted</text>

  <!-- CancellationStarted -->
  <g class="node">
    <rect x="270" y="106" width="220" height="46" rx="8"/>
    <text x="380" y="129" text-anchor="middle" dominant-baseline="central">CancellationStarted</text>
  </g>

  <!-- CancellationStarted -> PaymentsRefunded -->
  <line class="edge" x1="330" y1="152" x2="200" y2="269" marker-end="url(#arrow)"/>
  <text class="lbl" x="238" y="204" text-anchor="end">EventPaymentsRefunded</text>
  <text class="sub" x="238" y="220" text-anchor="end">sets bit 0</text>

  <!-- CancellationStarted -> TicketsArchived -->
  <line class="edge" x1="430" y1="152" x2="560" y2="269" marker-end="url(#arrow)"/>
  <text class="lbl" x="522" y="204">EventTicketsArchived</text>
  <text class="sub" x="522" y="220">sets bit 1</text>

  <!-- PaymentsRefunded / TicketsArchived -->
  <g class="node">
    <rect x="90" y="270" width="200" height="46" rx="8"/>
    <text x="190" y="293" text-anchor="middle" dominant-baseline="central">PaymentsRefunded</text>
  </g>
  <g class="node">
    <rect x="470" y="270" width="200" height="46" rx="8"/>
    <text x="570" y="293" text-anchor="middle" dominant-baseline="central">TicketsArchived</text>
  </g>

  <!-- PaymentsRefunded -> TicketsArchived -->
  <line class="edge" x1="290" y1="284" x2="469" y2="284" marker-end="url(#arrow)"/>
  <text class="lbl" x="380" y="276" text-anchor="middle">EventTicketsArchived</text>

  <!-- TicketsArchived -> PaymentsRefunded -->
  <line class="edge" x1="470" y1="302" x2="291" y2="302" marker-end="url(#arrow)"/>
  <text class="lbl" x="380" y="320" text-anchor="middle">EventPaymentsRefunded</text>

  <!-- PaymentsRefunded / TicketsArchived -> Final -->
  <path class="edge internal" d="M190 316 V490 H368" marker-end="url(#arrow)"/>
  <path class="edge internal" d="M570 316 V490 H392" marker-end="url(#arrow)"/>
  <text class="lbl" x="380" y="424" text-anchor="middle">EventCancellationCompleted</text>
  <text class="sub" x="380" y="442" text-anchor="middle">fires when status = 11</text>
  <text class="sub" x="380" y="459" text-anchor="middle">publishes completion, then Finalize()</text>

  <!-- Final -->
  <circle class="ring" cx="380" cy="490" r="11"/>
  <circle class="ink" cx="380" cy="490" r="6"/>
  <text class="sub" x="380" y="522" text-anchor="middle">Final</text>
</svg>
