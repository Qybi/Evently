services:
  evently.api:
    image: ${DOCKER_REGISTRY-}eventlyapi
    container_name: Evently.Api
    build:
      context: .
      dockerfile: src/API/Evently.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    depends_on:
      evently.database:
        condition: service_healthy
      evently.queue:
        condition: service_healthy

  evently.database:
    image: postgres:18
    container_name: Evently.Postgres
    environment:
      - POSTGRES_DB=evently
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evently"]
      interval: 5s
      timeout: 5s
      retries: 5

  evently.seq:
    image: datalust/seq:latest
    container_name: Evently.Seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 5344:5341
      - 8082:80
  
  evently.redis:
    image: redis:8
    container_name: Evently.Redis
    restart: always
    ports:
      - 6379:6379

  evently.identity:
    image: quay.io/keycloak/keycloak:26.7
    container_name: Evently.Identity
    command: start-dev
    environment:
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./.containers/identity:/opt/keycloak/data
      - ./.files:/opt/keycloak/data/import
    ports:
      - 18080:8080
      #- 19000:9000 # if you want to expose health check locally
  
  evently.jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: Evently.Jaeger
    ports:
      - 14317:4317
      - 14318:4318
      - 16686:16686

  evently.queue:
    image: rabbitmq:4-management-alpine
    container_name: Evently.Queue
    hostname: evently-queue
    volumes:
        - ./.containers/queue/data/:/var/lib/rabbitmq
        - ./.containers/queue/log/:/var/log/rabbitmq
    environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest
    ports:
      - 5673:5672
      - 15673:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10